services:
  postgres:
    image: postgres:16-alpine
    container_name: skillswap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillswap-network

  redis:
    image: redis:7-alpine
    container_name: skillswap-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillswap-network

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    container_name: skillswap-migrate
    restart: "no"
    env_file:
      - ./server/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    command: npm run migration:run
    working_dir: /app/server
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skillswap-network

  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: builder
    container_name: skillswap-seed
    restart: "no"
    env_file:
      - ./server/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    command: sh -c "npm run seeding:cities && npm run seeding:categories && npm run seeding:users"
    working_dir: /app/server
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - skillswap-network

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    container_name: skillswap-app
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "4567"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4567/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - skillswap-network

  web:
    build:
      context: .
      dockerfile: site/Dockerfile
      target: production
      args:
        VITE_API_URL: https://api.udarilisvtantcy.com
    container_name: skillswap-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - skillswap-network

networks:
  skillswap-network:
    name: skillswap-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config: