name: CI/CD

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint:server

      - name: Lint client
        run: npm run lint:client

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Server unit tests
        run: npm run test:server

      - name: Client unit tests
        run: npm run test:client

  e2e-tests:
    name: E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: skillswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_NAME: skillswap
      DB_SYNCHRONIZE: true
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      HASH_SALT: 10
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      S3_REGION: ru-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET_NAME: test-bucket
      CORS_ORIGINS: http://localhost:5173
      COOKIE_DOMAIN: .localhost
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      APP_PORT: 4567
      MAIL_HOST: smtp.test.local
      MAIL_PORT: 587
      MAIL_USER: test@test.local
      MAIL_PASSWORD: test-password
      MAIL_FROM: noreply@test.local
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:4567/api/auth/oauth/google/callback
      YANDEX_CLIENT_ID: test-yandex-client-id
      YANDEX_CLIENT_SECRET: test-yandex-client-secret
      YANDEX_CALLBACK_URL: http://localhost:4567/api/auth/oauth/yandex/callback

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /root/skillswap
            git pull origin main
            docker compose -f docker-compose.prod.yml up --build -d
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f